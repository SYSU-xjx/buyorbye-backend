spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: buyorbye-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/buyorbye?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:buyorbye_app}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-change-me}
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT

app:
  jwt-secret: ${JWT_SECRET}
  access-token-seconds: 86400
  refresh-token-days: 30
